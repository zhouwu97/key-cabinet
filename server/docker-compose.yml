services:
  postgres:
    image: postgres:14-alpine
    container_name: keycabinet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keycabinet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycabinet-api
    ports:
      - "8080:8080"
    environment:
      - KC_DATABASE_HOST=postgres
      - KC_DATABASE_PORT=5432
      - KC_DATABASE_USER=postgres
      - KC_DATABASE_PASSWORD=postgres
      - KC_DATABASE_DBNAME=keycabinet
      - KC_JWT_SECRET=docker-development-secret-change-in-production
      - KC_APP_ENV=development
      - KC_WECHAT_MOCK_ENABLED=true
      - KC_DEVICE_GATEWAY_TYPE=mock
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/keycabinet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
