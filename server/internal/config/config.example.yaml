app_env: development # development / test / production

server:
  port: 8080
  mode: debug # debug, release

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: keycabinet
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5

jwt:
  secret: change-this-secret-in-production
  expiration: 86400 # 24 hours in seconds

wechat:
  app_id: your-wechat-app-id
  app_secret: your-wechat-app-secret
  mock_enabled: true

device:
  gateway_type: mock # mock / mqtt
  mqtt_broker: tcp://localhost:1883
  # 多实例部署时必须为每个 API 实例配置唯一 client_id。
  mqtt_client_id: key-cabinet-api-local
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: kcab
  mqtt_qos: 1
  mqtt_connect_timeout_seconds: 10
  mqtt_command_timeout_seconds: 5
  mqtt_heartbeat_timeout_seconds: 90
