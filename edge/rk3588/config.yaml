cabinet:
  device_id: "CAB001"
  # 真实部署环境通过环境变量 CABINET_DEVICE_SECRET 或 config.local.yaml 注入
  device_secret: ""
  server_url: "http://127.0.0.1:8080"
  timeout_seconds: 5

camera:
  device_index: 0
  frame_width: 640
  frame_height: 480
  fps: 30

recognition:
  confidence_threshold: 0.80
  template_dir: "templates"
  max_faces_track: 1
  model_path: "edge/rk3588/face_app/models/mobilefacenet.onnx"
  allow_handcrafted_fallback: false # 生产模式禁止伪特征回退；仅在本地无模型调试时可显式设为 true

liveness:
  laplacian_threshold: 85.0    # 模糊度拦截阈值 (Laplacian 方差，<85.0 判定虚焦/低质照片)
  accept_score: 0.85           # 综合活体置信度通过阈值 (0.0 ~ 1.0)
  fft_high_freq_threshold: 0.80 # 摩尔条纹高频能量比阈值 (>0.80 判定屏幕翻拍)
  glare_ratio_threshold: 0.15   # 高反光像素占比阈值 (>0.15 判定高反光屏幕或反光介质)
